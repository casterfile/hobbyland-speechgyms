name: Build and deploy container app to Azure Web App - hobbyland-speechgyms

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: n8nhobbylandacr.azurecr.io/
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: |
            n8nhobbylandacr.azurecr.io/speechgyms-app:${{ github.sha }}
            n8nhobbylandacr.azurecr.io/speechgyms-app:latest
          file: ./Dockerfile
          no-cache: true

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Web App image tag to this commit SHA
        run: |
          az webapp config container set \
            --name hobbyland-speechgyms \
            --resource-group hobbyland-interview-rg \
            --container-image-name "n8nhobbylandacr.azurecr.io/speechgyms-app:${{ github.sha }}"
          az webapp restart \
            --name hobbyland-speechgyms \
            --resource-group hobbyland-interview-rg
